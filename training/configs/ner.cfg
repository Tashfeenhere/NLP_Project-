# Standalone NER training config (the `spacy init config --pipeline ner`
# route from the proposal).
#
# This trains a self-contained ["tok2vec", "ner"] artefact.  The runtime
# pipeline in nlp/pipeline.py detects an artefact without a parser and splices
# its NER head onto en_core_web_sm, which supplies the tagger/parser/lemmatizer
# that ROM binding and negation need.  The tok2vec width (96) deliberately
# matches en_core_web_sm so the NER listener can bind to the base encoder.
#
# The recommended route in the README is training/train_ner.py, which clones
# en_core_web_sm, freezes every base component, and retrains only the NER head.
# That produces a single self-contained model with no splice step.  This
# config is kept as the plan's config-file route and for training a standalone
# artefact:
#
#   python -m spacy train training\configs\ner.cfg ^
#       --paths.train data\processed\train.spacy ^
#       --paths.dev data\processed\dev.spacy ^
#       --output training\model-standalone --gpu-id -1
#
# Labels are learned from the training corpus (six clinical labels).

[paths]
train = null
dev = null
vectors = null
init_tok2vec = null

[system]
gpu_allocator = null
seed = 42

[nlp]
lang = "en"
pipeline = ["tok2vec","ner"]
batch_size = 64
disabled = []
before_creation = null
after_creation = null
after_pipeline_creation = null
tokenizer = {"@tokenizers":"spacy.Tokenizer.v1"}
vectors = {"@vectors":"spacy.Vectors.v1"}

[components]

[components.ner]
factory = "ner"
incorrect_spans_key = null
moves = null
scorer = {"@scorers":"spacy.ner_scorer.v1"}
update_with_oracle_cut_size = 100

[components.ner.model]
@architectures = "spacy.TransitionBasedParser.v2"
state_type = "ner"
extra_state_tokens = false
hidden_width = 64
maxout_pieces = 2
use_upper = true
nO = null

[components.ner.model.tok2vec]
@architectures = "spacy.Tok2VecListener.v1"
width = 96
upstream = "tok2vec"

[components.tok2vec]
factory = "tok2vec"

[components.tok2vec.model]
@architectures = "spacy.Tok2Vec.v2"

[components.tok2vec.model.embed]
@architectures = "spacy.MultiHashEmbed.v2"
width = 96
rows = [5000,1000,2500,2500,50,50]
attrs = ["NORM","PREFIX","SUFFIX","SHAPE","SPACY","IS_SPACE"]
include_static_vectors = false

[components.tok2vec.model.encode]
@architectures = "spacy.MaxoutWindowEncoder.v2"
width = 96
depth = 4
window_size = 1
maxout_pieces = 3

[corpora]

[corpora.dev]
@readers = "spacy.Corpus.v1"
path = ${paths.dev}
max_length = 0
gold_preproc = false
limit = 0
augmenter = null

[corpora.train]
@readers = "spacy.Corpus.v1"
path = ${paths.train}
max_length = 500
gold_preproc = false
limit = 0
augmenter = null

[training]
seed = 42
gpu_allocator = null
accumulate_gradient = 1
dev_corpus = "corpora.dev"
train_corpus = "corpora.train"
max_epochs = 40
max_steps = 20000
eval_frequency = 200
frozen_components = []
annotating_components = []
before_to_disk = null
dropout = 0.1
patience = 1600
before_update = null

[training.batcher]
@batchers = "spacy.batch_by_sequence.v1"
size = 8
get_length = null

[training.logger]
@loggers = "spacy.ConsoleLogger.v1"
progress_bar = false

[training.optimizer]
@optimizers = "Adam.v1"
learn_rate = 0.001
beta1 = 0.9
beta2 = 0.999
L2_is_weight_decay = true
L2 = 0.01
grad_clip = 1.0
use_averages = false
eps = 0.00000001

[training.score_weights]
ents_f = 0.33
ents_p = 0.33
ents_r = 0.33
ents_per_type = null

[pretraining]

[initialize]
vectors = ${paths.vectors}
init_tok2vec = ${paths.init_tok2vec}
vocab_data = null
lookups = null
before_init = null
after_init = null

[initialize.components]

[initialize.tokenizer]
